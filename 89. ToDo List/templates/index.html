<!DOCTYPE html>
<html lang="en">

<head>
    {{ bootstrap.load_css() }}
    <script src="https://kit.fontawesome.com/225f09b9b9.js" crossorigin="anonymous"></script>
</head>

<body>
    <section class="vh-100">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col">
                    <div class="card" id="list1" style="border-radius: .75rem; background-color: #eff1f2;">
                        <div class="card-body py-4 px-4 px-md-5">

                            <p class="h1 text-center mt-3 mb-4 pb-3 text-primary">
                                <i class="fas fa-check-square me-1"></i>
                                <u>My Todo-s</u>
                            </p>

                            <div class="pb-2">
                                <div class="card">
                                    <form class="card-body" method="post" action="{{ url_for('add') }}">
                                        <div class="d-flex flex-row align-items-center">
                                            <input type="text" class="form-control form-control-lg" id="text"
                                                name="text" placeholder="Add new...">
                                            <a href="#!" data-mdb-tooltip-init title="Set due date"><i
                                                    class="fas fa-calendar-alt fa-lg me-3"></i></a>
                                            <div>
                                                <button type="submit" data-mdb-button-init data-mdb-ripple-init
                                                    class="btn btn-primary">Add</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end align-items-center mb-4 pt-2 pb-3">
                                <p class="small mb-0 me-2 text-muted">Filter</p>
                                <select data-mdb-select-init>
                                    <option value="1">All</option>
                                    <option value="2">Completed</option>
                                    <option value="3">Active</option>
                                    <option value="4">Has due date</option>
                                </select>
                                <p class="small mb-0 ms-4 me-2 text-muted">Sort</p>
                                <select data-mdb-select-init>
                                    <option value="1">Added date</option>
                                    <option value="2">Due date</option>
                                </select>
                                <a href="#!" style="color: #23af89;" data-mdb-tooltip-init title="Ascending"><i
                                        class="fas fa-sort-amount-down-alt ms-2"></i></a>
                            </div>
                            {% for todo in todos %}
                            <ul class="list-group list-group-horizontal rounded-0 bg-transparent">
                                <li
                                    class="list-group-item d-flex align-items-center ps-0 pe-3 py-1 rounded-0 border-0 bg-transparent">
                                    <div class="form-check">
                                        <input class="form-check-input me-0 todo-checkbox"
                                            type="checkbox"
                                            data-todo-id="{{ todo.id }}"
                                            id="todo-{{ todo.id }}"
                                            aria-label="..."
                                            {% if todo.isChecked %} checked {% endif %} />
                                    </div>
                                </li>
                                <li
                                    class="list-group-item px-3 py-1 d-flex align-items-center flex-grow-1 border-0 bg-transparent">
                                    <p class="lead fw-normal mb-0">{{ todo.text }}</p>
                                    <span class="ms-2 text-muted small">#{{ todo.id }}</span>
                                </li>
                                <li class="list-group-item ps-3 pe-0 py-1 rounded-0 border-0 bg-transparent">
                                    <div class="d-flex flex-row justify-content-end mb-1">
                                        <!-- <a href="#!" class="text-info" data-mdb-tooltip-init title="Edit todo"><i
                                                class="fas fa-pencil-alt me-3"></i></a> -->
                                        <a href="{{ url_for('delete', id=todo.id) }}" class="text-danger" data-mdb-tooltip-init title="Delete todo"><i
                                                class="fas fa-trash-alt"></i></a>
                                    </div>
                                    <div class="text-end text-muted">
                                        <a href="#!" class="text-muted" data-mdb-tooltip-init title="Created date">
                                            <p class="small mb-0"><i class="fas fa-info-circle me-2"></i>28th Jun 2020
                                            </p>
                                        </a>
                                    </div>
                                </li>
                            </ul>
                            {% endfor %}
                            <ul class="list-group list-group-horizontal rounded-0">
                                <li
                                    class="list-group-item d-flex align-items-center ps-0 pe-3 py-1 rounded-0 border-0 bg-transparent">
                                    <div class="form-check">
                                        <input class="form-check-input me-0" type="checkbox" value=""
                                            id="flexCheckChecked2" aria-label="..." />
                                    </div>
                                </li>
                                <li
                                    class="list-group-item px-3 py-1 d-flex align-items-center flex-grow-1 border-0 bg-transparent">
                                    <p class="lead fw-normal mb-0">Renew car insurance</p>
                                </li>
                                <li class="list-group-item px-3 py-1 d-flex align-items-center border-0 bg-transparent">
                                    <div
                                        class="py-2 px-3 me-2 border border-warning rounded-3 d-flex align-items-center bg-body-tertiary">
                                        <p class="small mb-0">
                                            <a href="#!" data-mdb-tooltip-init title="Due on date">
                                                <i class="fas fa-hourglass-half me-2 text-warning"></i>
                                            </a>
                                            28th Jun 2020
                                        </p>
                                    </div>
                                </li>
                                <li class="list-group-item ps-3 pe-0 py-1 rounded-0 border-0 bg-transparent">
                                    <div class="d-flex flex-row justify-content-end mb-1">
                                        <a href="#!" class="text-info" data-mdb-tooltip-init title="Edit todo"><i
                                                class="fas fa-pencil-alt me-3"></i></a>
                                        <a href="#!" class="text-danger" data-mdb-tooltip-init title="Delete todo"><i
                                                class="fas fa-trash-alt"></i></a>
                                    </div>
                                    <div class="text-end text-muted">
                                        <a href="#!" class="text-muted" data-mdb-tooltip-init title="Created date">
                                            <p class="small mb-0"><i class="fas fa-info-circle me-2"></i>28th Jun 2020
                                            </p>
                                        </a>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".todo-checkbox").forEach((checkbox) => {
                checkbox.addEventListener("change", function () {
                    const todoId = this.dataset.todoId;
                    fetch(`/check/${todoId}`, {
                        method: "POST",
                        headers: {
                            "X-Requested-With": "XMLHttpRequest"
                        }
                    }).catch((error) => console.error("Error updating task:", error));
                });
            });
        });
    </script>
</body>

</html>
